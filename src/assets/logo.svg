<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="sdBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c142e" />
      <stop offset="100%" stop-color="#090611" />
    </linearGradient>
    <linearGradient id="sdBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="sdTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="sdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#d946ef" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Badge -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#sdBadgeGrad)" stroke="url(#sdBorderGrad)" stroke-width="3" />
  
  <!-- Subtle Internal Highlight -->
  <rect x="10" y="10" width="100" height="100" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" />

  <!-- Initials "SD" Monogram -->
  <g filter="url(#sdGlow)" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="54" letter-spacing="-3">
    <!-- 'S' Letter in Crisp White -->
    <text x="36" y="78" fill="#ffffff" text-anchor="middle" font-weight="900">S</text>
    <!-- 'D' Letter in Radiant Purple-Pink Gradient -->
    <text x="80" y="78" fill="url(#sdTextGrad)" text-anchor="middle" font-weight="900">D</text>
  </g>

  <!-- Accent Energy Dot -->
  <circle cx="94" cy="32" r="4.5" fill="#f472b6" />
  <circle cx="94" cy="32" r="2" fill="#ffffff" />
</svg>
